server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # The game is a single file; everything resolves to it.
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # Same-origin proxy to the EDA API so the browser needs no CORS exception
    # and the user's existing EDA session cookie is reused as-is.
    location /core/ {
        proxy_pass https://eda-api.eda-system.svc.cluster.local/core/;
        proxy_set_header Host              $host;
        proxy_set_header Authorization     $http_authorization;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_ssl_verify off;
    }
    location /apps/ {
        proxy_pass https://eda-api.eda-system.svc.cluster.local/apps/;
        proxy_set_header Host              $host;
        proxy_set_header Authorization     $http_authorization;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_ssl_verify off;
    }
}
