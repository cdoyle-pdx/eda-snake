<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nokia Snake</title>
<link rel="stylesheet" href="snake.css">
</head>
<body>
  <div id="roomGlow"></div>
  <div id="hud">
    <div class="box"><span class="lbl">Score</span><span class="val" id="scoreV">0</span></div>
    <div class="box"><span class="lbl">Level</span><span class="val" id="levelV">1</span></div>
    <div id="seq"></div>
    <div class="box"><span class="lbl">Letters</span><span class="val" id="lettersV">0/15</span></div>
    <div class="box"><span class="lbl">Snakes</span><span class="val" id="lives">●●●</span></div>
  </div>

  <div id="playRow">
    <div id="stage">
      <div id="hezBar"><div id="hezFill"></div></div>
      <canvas id="game"></canvas>
      <div id="scanlines"></div>
      <div class="overlay" id="overlay"></div>
    </div>
    <aside id="sideBoard"></aside>
  </div>
  <div id="controlsHint">Arrows / WASD move &nbsp;·&nbsp; Enter start &nbsp;·&nbsp; P pause &nbsp;·&nbsp; M mute &nbsp;·&nbsp; Esc title</div>

<script src="snake.js"></script>
</body>
</html>
